<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HTML 壁纸设置 [HTMLBG-SET]</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    /* 在独立设置窗口中，面板作为主内容静态显示 */
    body { height: 100%; }
    .panel {
      position: relative;
      transform: none;
      width: 100%;
      height: 100%;
      border-left: 0;
      border-radius: 0;
    }
    .panel.open { transform: none; }
    .scrim, .fab { display: none; }
    .panel-body { padding-bottom: 24px; }
  </style>
</head>
<body data-theme="dark">
  <aside id="panel" class="panel open">
    <header class="panel-head">
      <div>
        <h1>壁纸设置</h1>
        <p class="sub">通过界面或配置文件管理你的 HTML 壁纸</p>
      </div>
    </header>

    <div class="panel-body">
      <section class="block">
        <h2>来源</h2>
        <div class="tabs" id="sourceTabs">
          <button class="tab" data-tab="url">网址</button>
          <button class="tab" data-tab="file">本地文件</button>
          <button class="tab" data-tab="code">HTML 代码</button>
          <button class="tab" data-tab="builtin">内置动画</button>
        </div>
        <div class="panes">
          <div class="pane" data-pane="url">
            <label>网页地址</label>
            <input id="urlInput" type="text" placeholder="https://example.com" spellcheck="false" />
            <button id="loadUrl" class="btn">加载网址</button>
            <p class="hint">提示：部分网站设置了禁止嵌入（X-Frame-Options），将无法作为壁纸显示。</p>
          </div>
          <div class="pane" data-pane="file">
            <label>选择本地 HTML 文件</label>
            <input id="fileInput" type="file" accept=".html,.htm" />
            <label>或填写文件路径</label>
            <input id="filePath" type="text" placeholder="相对或绝对路径，例如 wallpaper.html" spellcheck="false" />
            <button id="loadFile" class="btn">加载文件</button>
          </div>
          <div class="pane" data-pane="code">
            <label>HTML 代码</label>
            <textarea id="codeInput" rows="9" placeholder="在此粘贴完整的 HTML 代码…"></textarea>
            <button id="applyCode" class="btn">应用代码</button>
          </div>
          <div class="pane" data-pane="builtin">
            <p class="hint">使用内置的极光动画背景。你也可以切换到「HTML 代码」自定义内容。</p>
            <button id="useBuiltin" class="btn">使用内置动画</button>
          </div>
        </div>
      </section>

      <section class="block">
        <h2>显示</h2>
        <label class="row">缩放 <span id="scaleVal" class="val">100%</span></label>
        <input id="scale" type="range" min="0.1" max="3" step="0.05" value="1" />
        <label class="row">不透明度 <span id="opacityVal" class="val">100%</span></label>
        <input id="opacity" type="range" min="0.1" max="1" step="0.05" value="1" />
        <label class="row">背景颜色</label>
        <input id="bg" type="color" value="#0a0a12" />
      </section>

      <section class="block">
        <h2>行为</h2>
        <label class="row">自动刷新（分钟，0 = 关闭）</label>
        <input id="reload" type="number" min="0" step="1" value="0" />
        <label class="check"><input id="hideCursor" type="checkbox" /> 隐藏鼠标指针</label>
        <label class="check"><input id="clickThrough" type="checkbox" /> 点击穿透（不响应鼠标操作）</label>
      </section>

      <section class="block">
        <h2>界面</h2>
        <label class="row">主题</label>
        <select id="theme">
          <option value="dark">暗色</option>
          <option value="light">亮色</option>
          <option value="system">跟随系统</option>
        </select>
        <label class="row">主题色</label>
        <input id="accent" type="color" value="#7c5cff" />
      </section>

      <section class="block">
        <h2>配置文件</h2>
        <div class="config-actions">
          <button id="exportBtn" class="btn ghost">导出配置</button>
          <button id="importBtn" class="btn ghost">导入配置</button>
          <button id="restoreBtn" class="btn ghost">从配置文件恢复</button>
          <button id="resetBtn" class="btn ghost danger">恢复默认</button>
          <input id="importInput" type="file" accept=".json" hidden />
        </div>
        <p class="hint">
          改动会实时同步到桌面壁纸（由本程序内置的小浏览器转发）。<br />
          想让 <code>config.json</code> 重新生效，点「从配置文件恢复」；想把手上的配置存成文件，用「导出配置」。
        </p>
        <p class="hint" id="statusLine">就绪</p>
      </section>
    </div>

    <footer class="panel-foot">
      <button id="applyBtn" class="btn primary">保存并应用</button>
    </footer>
  </aside>

  <script src="config-inject.js"></script>
  <script src="settings.js"></script>
</body>
</html>
