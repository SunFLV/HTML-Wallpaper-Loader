<!doctype html>
<html>
<head><meta charset="utf-8"><title>docs parser check</title></head>
<body>
<pre id="log">running…</pre>
<script src="presets/docs.js"></script>
<script>
var FILES = ["test_sample.docx", "test_sample.xlsx", "test_sample.pptx",
             "test_sample.pdf", "test_sample.csv", "test_sample.txt"];

function esc(s) {
  var out = "";
  for (var i = 0; i < s.length; i++) {
    var c = s.charCodeAt(i);
    if (c > 126) out += "\\u" + ("0000" + c.toString(16)).slice(-4);
    else if (c === 10) out += "\\n";
    else out += s.charAt(i);
  }
  return out;
}

function unesc(s) {
  return s.replace(/\\u([0-9a-fA-F]{4})/g, function (m, h) { return String.fromCharCode(parseInt(h, 16)); });
}

(async function () {
  var out = [];
  for (var i = 0; i < FILES.length; i++) {
    var n = FILES[i];
    try {
      var r = await fetch(n, { cache: "no-store" });
      if (!r.ok) throw new Error("HTTP " + r.status);
      var blob = await r.blob();
      var file = new File([blob], n, { type: r.headers.get("Content-Type") || "" });
      var doc = await window.HTMLBGDocs.read(file);
      var preview = (doc.blocks || []).slice(0, 3).map(function (b) {
        return (b.tag ? "[" + b.tag + "] " : (b.level ? "H" + b.level + " " : "")) + b.text;
      }).join(" / ");
      out.push({ n: n, ok: true, kind: doc.kind, ext: doc.ext, blocks: (doc.blocks || []).length,
                 meta: doc.meta || {}, note: doc.note || "", preview: esc(preview).slice(0, 300) });
    } catch (e) {
      out.push({ n: n, ok: false, err: esc(String((e && e.message) || e)).slice(0, 300) });
    }
  }
  document.getElementById("log").textContent = JSON.stringify(out, null, 1);
  document.title = "[[result:" + encodeURIComponent(JSON.stringify(out)) + "]]";
})();
</script>
</body>
</html>
